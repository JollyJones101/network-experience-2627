name: Projecttaak
description: Plan en volg een gewone projecttaak op.
title: "[Project] "
labels: ["chore"]
body:
  - type: textarea
    id: context
    attributes:
      label: Waarde en context
      description: Voor welke gebruiker of projectvereiste is dit nodig?
      placeholder: Beschrijf het gewenste resultaat, niet alleen de activiteit.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Stappenplan
      placeholder: Welke stappen voeren jullie uit?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Acceptatiecriteria
      placeholder: Formuleer concrete, testbare voorwaarden.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Positieve en negatieve test
      placeholder: Hoe bewijzen jullie wat wel en niet mag werken?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentatie
      placeholder: Welke bestanden worden bijgewerkt?
    validations:
      required: true
