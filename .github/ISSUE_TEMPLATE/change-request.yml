name: Change request
description: Vraag een risicovolle of impactvolle wijziging aan.
title: "[Change] "
labels: ["change"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Doel
      description: Waarom is deze wijziging nodig?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Wat wordt aangepast?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact en onderhoudsvenster
      description: Wie kan hinder ondervinden en wanneer wordt de change uitgevoerd?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risico-inschatting
      description: Welke risico's zijn er?
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Uitvoeringsplan
      description: Welke stappen voeren jullie uit?
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollbackplan
      description: Hoe draaien jullie veilig terug?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validatie
      description: Hoe controleren jullie dat de wijziging correct is?
    validations:
      required: true
  - type: textarea
    id: communication
    attributes:
      label: Communicatie
      description: Wie wordt voor, tijdens en na de change geïnformeerd?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentatie-impact
      description: Welke documentatie wordt bijgewerkt?
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Uitvoering
      options:
        - label: Ik voer deze change pas uit nadat de vereiste goedkeuring expliciet is geregistreerd.
          required: true
