name: Issue changelog

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add changelog entry
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'changelog.md';
            const issue = context.payload.issue;

            const known = [
              'feature', 'fix', 'chore', 'docs', 'refactor',
              'support', 'incident', 'change', 'question',
              'must', 'should', 'could', 'other'
            ];

            const labels = (issue.labels || []).map(label =>
              typeof label === 'string' ? label : label.name
            ).filter(Boolean);

            const type = labels.find(label => known.includes(label)) || 'other';
            const date = new Date().toISOString().slice(0, 10);
            const body = (issue.body || '').trim();
            const summary = body
              ? body.split('\n').map(line => line.trim()).find(Boolean)
              : 'Geen extra beschrijving opgegeven.';

            const entry = [
              '',
              `## ${date} - [${type}] ${issue.title}`,
              '',
              `- Issue: #${issue.number}`,
              `- Labels: ${labels.length ? labels.join(', ') : 'geen'}`,
              `- Samenvatting: ${summary}`,
              ''
            ].join('\n');

            const current = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '# Changelog\n';

            fs.writeFileSync(path, current.trimEnd() + entry + '\n');

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update changelog for closed issue"
          file_pattern: changelog.md

